name: WordPress version
# Goes red the week a new WordPress reaches release candidate, so the listing
# names it before it ships.
on:
    schedule:
        - cron: '17 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tested-up-to:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - run: npm run check:tested-up-to
