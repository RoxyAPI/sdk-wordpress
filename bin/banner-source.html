<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1544px;
				height: 500px;
				overflow: hidden;
			}
			.banner {
				position: relative;
				width: 1544px;
				height: 500px;
				background: linear-gradient(
					115deg,
					#35142a 0%,
					#4a1f36 42%,
					#9a3159 100%
				);
				font-family: 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans',
					sans-serif;
				overflow: hidden;
			}
			/* radiant sun, echoing the icon, cropped by the right edge */
			.sun {
				position: absolute;
				right: -235px;
				top: 50%;
				transform: translateY( -50% );
				width: 700px;
				height: 700px;
			}
			/* faint orbit rings, same ornament layer as the icon */
			.rings {
				position: absolute;
				right: -235px;
				top: 50%;
				transform: translateY( -50% );
				width: 700px;
				height: 700px;
			}

			.content {
				position: absolute;
				left: 64px;
				top: 50%;
				transform: translateY( -50% );
			}
			.wordmark {
				font-size: 26px;
				font-weight: 700;
				color: #fff;
				letter-spacing: -0.2px;
			}
			.wordmark span {
				font-weight: 400;
				color: #f3d9c4;
			}
			.eyebrow {
				margin-top: 9px;
				font-size: 14px;
				font-weight: 600;
				letter-spacing: 5.5px;
				color: #e6b98f;
				text-transform: uppercase;
			}
			h1 {
				margin-top: 22px;
				font-size: 60px;
				line-height: 1.1;
				font-weight: 700;
				color: #fff;
				letter-spacing: -1.6px;
			}
			h1 em {
				font-style: normal;
				color: #f7c948;
			}
			.chip {
				display: inline-block;
				margin-top: 28px;
				padding: 13px 22px;
				border: 1px solid rgba( 247, 201, 72, 0.45 );
				border-radius: 9px;
				background: rgba( 247, 201, 72, 0.1 );
				font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace;
				font-size: 20px;
				color: #f7c948;
				letter-spacing: 0.3px;
			}
			.foot {
				margin-top: 26px;
				font-size: 17px;
				color: #e8c3ab;
			}
		</style>
	</head>
	<body>
		<div class="banner">
			<svg class="rings" viewBox="0 0 760 760">
				<g
					fill="none"
					stroke="#fbf6f3"
					stroke-opacity=".16"
					stroke-width="1.6"
				>
					<circle cx="380" cy="380" r="250" />
					<circle cx="380" cy="380" r="300" />
					<circle cx="380" cy="380" r="348" />
				</g>
				<g fill="#fbf6f3" fill-opacity=".55">
					<circle cx="380" cy="32" r="6" />
					<circle cx="728" cy="380" r="6" />
					<circle cx="380" cy="728" r="6" />
					<circle cx="626" cy="134" r="5" />
					<circle cx="626" cy="626" r="5" />
				</g>
			</svg>
			<svg class="sun" viewBox="0 0 760 760">
				<defs>
					<radialGradient id="orb" cx="42%" cy="36%">
						<stop offset="0%" stop-color="#ffd25e" />
						<stop offset="62%" stop-color="#f7b32b" />
						<stop offset="100%" stop-color="#ef8f33" />
					</radialGradient>
					<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0%" stop-color="#f7c948" />
						<stop offset="100%" stop-color="#f0a52e" />
					</linearGradient>
				</defs>
				<g id="rays" fill="url(#ray)"></g>
				<circle cx="380" cy="380" r="150" fill="url(#orb)" />
			</svg>
			<div class="content">
				<div class="wordmark">Roxy<span>API</span></div>
				<div class="eyebrow">WordPress Plugin</div>
				<h1>
					Astrology, Vedic, Forecast,<br />Human Design.
					<em>On any page.</em>
				</h1>
				<div class="chip">[roxy_natal_chart]</div>
				<div class="foot">One key. Every domain. Free to start.</div>
			</div>
		</div>
		<script>
			// 16 alternating rays: 8 long, 8 short, matching the icon's construction
			const g = document.getElementById( 'rays' );
			const cx = 380,
				cy = 380,
				inner = 138;
			for ( let i = 0; i < 16; i++ ) {
				const long = i % 2 === 0;
				const len = long ? 372 : 250;
				const half = long ? 15 : 26; // half-width in degrees at the base
				const a = ( ( i * 22.5 - 90 ) * Math.PI ) / 180;
				const a1 = a - ( half * Math.PI ) / 180 / 2;
				const a2 = a + ( half * Math.PI ) / 180 / 2;
				const p = document.createElementNS(
					'http://www.w3.org/2000/svg',
					'path'
				);
				p.setAttribute(
					'd',
					`M ${ cx + inner * Math.cos( a1 ) } ${
						cy + inner * Math.sin( a1 )
					}
       L ${ cx + len * Math.cos( a ) }  ${ cy + len * Math.sin( a ) }
       L ${ cx + inner * Math.cos( a2 ) } ${ cy + inner * Math.sin( a2 ) } Z`
				);
				g.appendChild( p );
			}
		</script>
	</body>
</html>
